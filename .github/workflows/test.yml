name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

# Least-privilege default token for every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        os:
          - ubuntu-latest
        python-version:
          ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t", pypy3.11]
        include:
          # Windows: Test lowest and highest supported Python versions
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.15"

    env:
      # Select the tox envs for this matrix entry (see `[gh]` in `tox.ini`).
      TOX_GH_MAJOR_MINOR: ${{ matrix.python-version }}
      # Use uv-managed interpreters everywhere.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: requirements-ci.txt
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            tox.ini
            requirements-ci.txt

      - name: Install tox
        run: uv tool install --python 3.15 --with-requirements requirements-ci.txt tox

      - name: Setup test suite
        run: tox run -v --notest --skip-missing-interpreters false

      - name: Run test suite
        run: tox run --skip-pkg-install
